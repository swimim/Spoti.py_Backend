services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=spotipy
    volumes:
      - "mysql_data:/data"
    restart: unless-stopped

volumes:
  mysql_data: